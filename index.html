    <!-- SFX Audio Controller -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'click') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.04);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }
    </script>

                    <div class="space-y-6">
                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs font-bold text-amber-800 flex items-center gap-2">
                            <i class="fa-solid fa-fire text-amber-600 text-base"></i> 最終確認：類題での再現テスト
                        </div>
                        <div class="bg-slate-900 text-white p-5 rounded-xl space-y-3 shadow-inner font-sans">
                            <p class="text-base text-slate-100 leading-relaxed">${repro.passage}</p>
                            <p class="font-bold text-teal-300 text-base border-t border-slate-700 pt-3">${repro.q}</p>
                        </div>
                        <div class="space-y-3" id="options-box">
                            ${repro.opts.map((opt, idx) => `
                                <button onclick="app.checkAns(${idx}, ${opt.correct}, '${encodeURIComponent(opt.fb)}', true)" class="repro-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all font-medium text-slate-700 flex items-start gap-3">
                                    <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
                                    <span class="text-sm sm:text-base">${opt.t}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedback-box" class="hidden"></div>
                        <button id="next-item-btn" onclick="app.nextItem()" class="hidden w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-all flex items-center justify-center gap-2">
                            <span>次の問題へ進む</span> <i class="fa-solid fa-trophy"></i>
                        </button>
                    </div>
                `;
            }
        }

        function renderReadingQuestion(catData, item, totalItems) {
            const subQ = item.subQs[state.subQIndex];
            const totalSubQs = item.subQs.length;
            const hasSteps = state.subQIndex >= totalSubQs;
            const isRepro = state.subQIndex > totalSubQs;

            let progressPct = Math.round(((state.currentIndex * (totalSubQs + item.steps.length + 1) + state.subQIndex) / (totalItems * (totalSubQs + item.steps.length + 1))) * 100);

            let headerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <span class="px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-bold rounded-md">
                        読解長文セット ${state.currentIndex + 1} / ${totalItems}
                    </span>
                    <span class="text-xs font-bold text-slate-500">${progressPct}% 完了</span>
                </div>
                <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-6">
                    <div class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                </div>
            `;

            if (!hasSteps) {
                container.innerHTML = `
                    ${headerHTML}
                    <div class="space-y-6">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm font-serif">
                            ${item.passage}
                        </div>
                        <div>
                            <span class="text-xs font-extrabold text-amber-600 uppercase tracking-wider block mb-1">
                                設問 ${state.subQIndex + 1} / ${totalSubQs}: ${subQ.title}
                            </span>
                            <h3 class="font-bold text-slate-900 text-base sm:text-lg">${subQ.q}</h3>
                        </div>
                        <div class="space-y-3" id="options-box">
                            ${subQ.opts.map((opt, idx) => `
                                <button onclick="app.checkSubQAns(${idx}, ${opt.correct}, '${encodeURIComponent(opt.fb)}')" class="opt-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-amber-500 hover:bg-amber-50/50 transition-all font-medium text-slate-700 flex items-start gap-3">
                                    <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
                                    <span class="text-sm sm:text-base">${opt.t}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedback-box" class="hidden"></div>
                        <button id="next-subq-btn" onclick="app.nextSubQ()" class="hidden w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow transition-all flex items-center justify-center gap-2">
                            <span>次の設問へ進む</span> <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
            } else if (!isRepro) {
                const step = item.steps[state.subQIndex - totalSubQs];
                container.innerHTML = `
                    ${headerHTML}
                    <div class="space-y-6">
                        <div class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl text-xs font-bold text-indigo-900">
                            💡 長文読解の解法ステップ確認
                        </div>
                        <div>
                            <span class="text-xs font-extrabold text-indigo-600 uppercase tracking-wider block mb-1">解法アルゴリズム</span>
                            <h3 class="font-bold text-slate-900 text-base sm:text-lg">${step.q}</h3>
                        </div>
                        <div class="space-y-3" id="options-box">
                            ${step.opts.map((opt, idx) => `
                                <button onclick="app.checkSubQAns(${idx}, ${opt.correct}, '${encodeURIComponent(opt.fb)}')" class="opt-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all font-medium text-slate-700 flex items-start gap-3">
                                    <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
                                    <span class="text-sm sm:text-base">${opt.t}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedback-box" class="hidden"></div>
                        <button id="next-subq-btn" onclick="app.nextSubQ()" class="hidden w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition-all flex items-center justify-center gap-2">
                            <span>次へ進む</span> <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
            } else {
                const repro = item.repro;
                container.innerHTML = `
                    ${headerHTML}
                    <div class="space-y-6">
                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs font-bold text-amber-800 flex items-center gap-2">
                            <i class="fa-solid fa-fire text-amber-600 text-base"></i> 最終確認：読解・類題再現テスト
                        </div>
                        <div class="bg-slate-900 text-white p-5 rounded-xl space-y-3 shadow-inner font-serif">
                            <p class="text-base text-slate-100 leading-relaxed">${repro.passage}</p>
                            <p class="font-bold text-teal-300 text-base border-t border-slate-700 pt-3 font-sans">${repro.q}</p>
                        </div>
                        <div class="space-y-3" id="options-box">
                            ${repro.opts.map((opt, idx) => `
                                <button onclick="app.checkReproReading(${idx}, ${opt.correct}, '${encodeURIComponent(opt.fb)}')" class="repro-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all font-medium text-slate-700 flex items-start gap-3">
                                    <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
                                    <span class="text-sm sm:text-base">${opt.t}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedback-box" class="hidden"></div>
                        <button id="next-item-btn" onclick="app.nextItem()" class="hidden w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-all flex items-center justify-center gap-2">
                            <span>次の問題へ進む</span> <i class="fa-solid fa-trophy"></i>
                        </button>
                    </div>
                `;
            }
        }

        function checkAns(idx, isCorrect, encodedFb, isRepro) {
            const fbBox = document.getElementById('feedback-box');
            const buttons = document.querySelectorAll(isRepro ? '.repro-btn' : '.opt-btn');
            const clickedBtn = buttons[idx];
            const fbText = decodeURIComponent(encodedFb);

            if (isCorrect) {
                playSound('correct');
                buttons.forEach(b => {
                    b.disabled = true;
                    b.classList.add('opacity-65', 'cursor-not-allowed');
                });
                clickedBtn.classList.remove('border-slate-200', 'opacity-65');
                clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-500/20');

                fbBox.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';
                fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> 正解！</div><p>${fbText}</p>`;
                fbBox.classList.remove('hidden');

                if (!isRepro) {
                    document.getElementById('next-step-btn').classList.remove('hidden');
                } else {
                    document.getElementById('next-item-btn').classList.remove('hidden');
                }
            } else {
                playSound('wrong');
                clickedBtn.disabled = true;
                clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900', 'opacity-70');

                fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
                fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解です。</div><p>${fbText} （別の選択肢を選び直してください）</p>`;
                fbBox.classList.remove('hidden');
            }
        }

        function checkSubQAns(idx, isCorrect, encodedFb) {
            const fbBox = document.getElementById('feedback-box');
            const buttons = document.querySelectorAll('.opt-btn');
            const clickedBtn = buttons[idx];
            const fbText = decodeURIComponent(encodedFb);

            if (isCorrect) {
                playSound('correct');
                buttons.forEach(b => {
                    b.disabled = true;
                    b.classList.add('opacity-65', 'cursor-not-allowed');
                });
                clickedBtn.classList.remove('border-slate-200', 'opacity-65');
                clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-500/20');

                fbBox.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';
                fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> 正解！</div><p>${fbText}</p>`;
                fbBox.classList.remove('hidden');
                document.getElementById('next-subq-btn').classList.remove('hidden');
            } else {
                playSound('wrong');
                clickedBtn.disabled = true;
                clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900', 'opacity-70');

                fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
                fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解です。</div><p>${fbText} （選び直してください）</p>`;
                fbBox.classList.remove('hidden');
            }
        }

        function checkReproReading(idx, isCorrect, encodedFb) {
            const fbBox = document.getElementById('feedback-box');
            const buttons = document.querySelectorAll('.repro-btn');
            const clickedBtn = buttons[idx];
            const fbText = decodeURIComponent(encodedFb);

            if (isCorrect) {
                playSound('correct');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                buttons.forEach(b => b.disabled = true);
                clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');

                fbBox.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';
                fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> 読解再現成功！</div><p>${fbText}</p>`;
                fbBox.classList.remove('hidden');
                document.getElementById('next-item-btn').classList.remove('hidden');
            } else {
                playSound('wrong');
                clickedBtn.disabled = true;
                clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900');
                fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
                fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解。</div><p>${fbText}</p>`;
                fbBox.classList.remove('hidden');
            }
        }

        function nextStep() {
            state.currentStepIndex++;
            renderQuestion();
        }

        function nextSubQ() {
            state.subQIndex++;
            renderQuestion();
        }

        function nextItem() {
            const catData = db[state.currentCategory];
            state.currentIndex++;
            state.currentStepIndex = 0;
            state.subQIndex = 0;

            if (state.currentIndex >= catData.items.length) {
                renderClearScreen();
            } else {
                renderQuestion();
            }
        }

        function renderClearScreen() {
            homeBtn.classList.add('hidden');
            container.innerHTML = `
                <div class="text-center py-8 space-y-6 fade-in">
                    <div class="w-24 h-24 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center mx-auto shadow-xl text-white text-4xl animate-bounce">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-950">全ミッション・完全クリア！</h2>
                        <p class="text-sm text-slate-600 max-w-md mx-auto">
                            おめでとうございます！このジャンルの判断基準・処理手順（解法OS）のインプットと類題でのアウトプットを完遂しました。
                        </p>
                    </div>
                    <div class="pt-4 max-w-sm mx-auto space-y-3">
                        <button onclick="app.renderHome()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-house"></i> ジャンル選択メニューへ戻る
                        </button>
                        <button onclick="app.startCategory('${state.currentCategory}')" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i> もう一度はじめから復習する
                        </button>
                    </div>
                </div>
            `;
        }

        window.app = {
            renderHome,
            startCategory,
            checkAns,
            checkSubQAns,
            checkReproReading,
            nextStep,
            nextSubQ,
            nextItem,
            returnHome: renderHome
        };

        renderHome();
    </script>
</body>
</html>
