<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
try {
if (audioCtx.state === 'suspended') audioCtx.resume();
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
if (type === 'click') {
osc.frequency.setValueAtTime(600, audioCtx.currentTime);
gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
osc.start(); osc.stop(audioCtx.currentTime + 0.04);
} else if (type === 'correct') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
osc.start(); osc.stop(audioCtx.currentTime + 0.25);
} else if (type === 'wrong') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(220, audioCtx.currentTime);
osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}
} catch(e) {}
}
</script>

// 頻出表現120の3択問題生成ロジック（ランダム誤答・位置ランダム）
function generateIdiomStageData(partNum) {
const allAnswers = rawIdiomsData.map(d => d.ans);
const startIdx = (partNum - 1) * 20;
const endIdx = startIdx + 20;
const stageQs = rawIdiomsData.slice(startIdx, endIdx);

const items = stageQs.map((q, idx) => {
const correctAns = q.ans;
// 他の119個から2つ重複なく誤答を選択
const otherAnsList = Array.from(new Set(allAnswers.filter(a => a !== correctAns)));
// 簡易シード乱数で毎回決まった選択肢を安定生成（リロードしても変わらないように）
const rand1 = (q.id * 7 + partNum * 13) % otherAnsList.length;
let rand2 = (q.id * 11 + partNum * 17) % otherAnsList.length;
if (rand1 === rand2) rand2 = (rand2 + 1) % otherAnsList.length;

const distractor1 = otherAnsList[rand1];
const distractor2 = otherAnsList[rand2];

let choices = [
{ t: correctAns, correct: true },
{ t: distractor1, correct: false },
{ t: distractor2, correct: false }
];

// 選択肢の並び順を問題IDをもとに決定（A/B/Cランダム）
const shufflePattern = (q.id + partNum) % 3;
if (shufflePattern === 1) choices = [choices[1], choices[0], choices[2]];
else if (shufflePattern === 2) choices = [choices[2], choices[1], choices[0]];

const opts = choices.map((c, cIdx) => ({
t: `${String.fromCharCode(65 + cIdx)}: ${c.t}`,
correct: c.correct
}));

return {
id: q.id,
question: `「${q.jp}」<br><strong>${q.eng}</strong>`,
explanation: `【判断基準】「${q.jp}」にあたる頻出表現は「${correctAns}」です。`,
opts: opts
};
});

return {
title: `⑧ 頻出熟語 Part ${partNum}（Q${startIdx + 1}〜${endIdx}）`,
desc: `入試頻出表現120（第${partNum}ステージ）。例文の空所に入る適切な表現を判定します。`,
items: items
};
}

}

function getCategoryProgressInfo(catKey) {
const catData = db[catKey];
if (!catData || !catData.items || catData.items.length === 0) return { pct: 0, isStarted: false, isCleared: false };
const totalItems = catData.items.length;
const progress = loadProgress(catKey);
if (!progress) return { pct: 0, isStarted: false, isCleared: false };
let currentItem = progress.currentIndex;
if (currentItem >= totalItems) return { pct: 100, isStarted: true, isCleared: true };
if (catKey === 'quickGrammar' || catKey.startsWith('idiomsStage')) {
let pct = Math.min(99, Math.round((currentItem / totalItems) * 100));
return { pct, isStarted: currentItem > 0, isCleared: false, currentItem: currentItem + 1 };
}
let totalStepsOverall = 0;
catData.items.forEach(it => { totalStepsOverall += (catKey === 'reading') ? ((it.subQs ? it.subQs.length : 0) + (it.steps ? it.steps.length : 0) + 1) : ((it.steps ? it.steps.length : 0) + 1); });
let doneStepsOverall = 0;
for (let i = 0; i < currentItem; i++) {
let it = catData.items[i];
doneStepsOverall += (catKey === 'reading') ? ((it.subQs ? it.subQs.length : 0) + (it.steps ? it.steps.length : 0) + 1) : ((it.steps ? it.steps.length : 0) + 1);
}
doneStepsOverall += (catKey === 'reading') ? progress.subQIndex : progress.currentStepIndex;
let pct = Math.min(99, Math.round((doneStepsOverall / Math.max(1, totalStepsOverall)) * 100));
return { pct, isStarted: doneStepsOverall > 0, isCleared: false, currentItem: currentItem + 1 };
}

function startCategory(catKey, forceReset = false) {
state.currentCategory = catKey;
if (forceReset) {
state.currentIndex = 0; state.currentStepIndex = 0; state.subQIndex = 0;
clearCategoryProgress(catKey);
} else {
const saved = loadProgress(catKey);
if (saved) {
state.currentIndex = saved.currentIndex || 0;
state.currentStepIndex = saved.currentStepIndex || 0;
state.subQIndex = saved.subQIndex || 0;
} else {
state.currentIndex = 0; state.currentStepIndex = 0; state.subQIndex = 0;
}
}
homeBtn.classList.remove('hidden');
renderQuestion();
}

function renderQuestion() {
window.scrollTo(0, 0);
saveProgress();
container.classList.remove('fade-in');
void container.offsetWidth;
container.classList.add('fade-in');
const catData = db[state.currentCategory];
const item = catData.items[state.currentIndex];
const totalItems = catData.items.length;

if (state.currentCategory === 'quickGrammar' || state.currentCategory.startsWith('idiomsStage')) {
renderQuickGrammarQuestion(catData, item, totalItems);
return;
}
if (state.currentCategory === 'reading') {
renderReadingQuestion(catData, item, totalItems);
return;
}

const steps = item.steps || [];
const isRepro = state.currentStepIndex >= steps.length;
const progressPct = Math.round(((state.currentIndex * (steps.length + 1) + state.currentStepIndex) / (totalItems * (steps.length + 1))) * 100);
let headerHTML = `
<div class="flex justify-between items-center mb-4">
<span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-md">
${catData.title} （問題 ${state.currentIndex + 1} / ${totalItems}）
</span>
<span class="text-xs font-bold text-slate-500">${progressPct}% 完了</span>
</div>

<div class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
</div>
`;
if (!isRepro) {
const step = steps[state.currentStepIndex];
container.innerHTML = `
${headerHTML}
<div class="space-y-6">
<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm font-sans">

</div>

clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-500/20');
fbBox.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> 正解！</div><p>${fbText}</p>`;
fbBox.classList.remove('hidden');
if (!isRepro) document.getElementById('next-step-btn').classList.remove('hidden');
else document.getElementById('next-item-btn').classList.remove('hidden');
} else {
playSound('wrong');
clickedBtn.disabled = true;
clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900', 'opacity-70');
fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解です。</div><p>${fbText} （別の選択肢を選び直してください）</p>`;
fbBox.classList.remove('hidden');
}
}

function checkSubQAns(idx, isCorrect, encodedFb) {
const fbBox = document.getElementById('feedback-box');
const buttons = document.querySelectorAll('.opt-btn');
const clickedBtn = buttons[idx];
const fbText = decodeURIComponent(encodedFb);
if (isCorrect) {
playSound('correct');
buttons.forEach(b => { b.disabled = true; b.classList.add('opacity-65', 'cursor-not-allowed'); });
clickedBtn.classList.remove('border-slate-200', 'opacity-65');
clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-500/20');
fbBox.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> 正解！</div><p>${fbText}</p>`;
fbBox.classList.remove('hidden');
document.getElementById('next-subq-btn').classList.remove('hidden');
} else {
playSound('wrong');
clickedBtn.disabled = true;
clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900', 'opacity-70');
fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解です。</div><p>${fbText} （選び直してください）</p>`;
fbBox.classList.remove('hidden');
}
}

function checkReproReading(idx, isCorrect, encodedFb) {
const fbBox = document.getElementById('feedback-box');
const buttons = document.querySelectorAll('.repro-btn');
const clickedBtn = buttons[idx];
const fbText = decodeURIComponent(encodedFb);
if (isCorrect) {
playSound('correct');
confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
buttons.forEach(b => b.disabled = true);
clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
fbBox.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> 読解再現成功！</div><p>${fbText}</p>`;
fbBox.classList.remove('hidden');
document.getElementById('next-item-btn').classList.remove('hidden');
} else {
playSound('wrong');
clickedBtn.disabled = true;
clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900');
fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `<div class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解。</div><p>${fbText}</p>`;
fbBox.classList.remove('hidden');
}
}

function nextStep() { state.currentStepIndex++; renderQuestion(); }
function nextSubQ() { state.subQIndex++; renderQuestion(); }
function nextItem() {
const catData = db[state.currentCategory];
state.currentIndex++;
state.currentStepIndex = 0;
state.subQIndex = 0;
if (state.currentIndex >= catData.items.length) {
clearCategoryProgress(state.currentCategory);
renderClearScreen();
} else {
renderQuestion();
}
}

function renderClearScreen() {
window.scrollTo(0, 0);
homeBtn.classList.add('hidden');
const clearedCat = state.currentCategory;
container.innerHTML = `
<div class="text-center py-8 space-y-6 fade-in">
<div class="w-24 h-24 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center mx-auto shadow-xl text-white text-4xl animate-bounce">
<i class="fa-solid fa-trophy"></i>
</div>
<div class="space-y-2">
<h2 class="text-2xl sm:text-3xl font-extrabold text-slate-950">全ミッション・完全クリア！</h2>
<p class="text-sm text-slate-600 max-w-md mx-auto">
おめでとうございます！このジャンルの問題セットをすべて完遂しました。
</p>
</div>
<div class="pt-4 max-w-sm mx-auto space-y-3">
<button onclick="app.renderHome()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
<i class="fa-solid fa-house"></i> ジャンル選択メニューへ戻る
</button>
<button onclick="app.startCategory('${clearedCat}', true)" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all flex items-center justify-center gap-2">
<i class="fa-solid fa-rotate-right"></i> もう一度はじめから復習する
</button>
</div>
</div>
`;
}

window.app = {
renderHome, startCategory, checkAns, checkQuickGrammarAns, checkSubQAns, checkReproReading, nextStep, nextSubQ, nextItem, returnHome: renderHome, resetAllProgress
};

renderHome();
</script>
</body>
</html>
