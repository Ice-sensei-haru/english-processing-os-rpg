<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
try {
if (audioCtx.state === 'suspended') audioCtx.resume();
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
if (type === 'click') {
osc.frequency.setValueAtTime(600, audioCtx.currentTime);
gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
osc.start(); osc.stop(audioCtx.currentTime + 0.04);
} else if (type === 'correct') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
osc.start(); osc.stop(audioCtx.currentTime + 0.25);
} else if (type === 'wrong') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(220, audioCtx.currentTime);
osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}
} catch(e) {}
}
</script>

// 頻出表現120の3択問題生成ロジック（ランダム誤答・位置ランダム）
function generateIdiomStageData(partNum) {
const allAnswers = rawIdiomsData.map(d => d.ans);
const startIdx = (partNum - 1) * 20;
const endIdx = startIdx + 20;
const stageQs = rawIdiomsData.slice(startIdx, endIdx);

const items = stageQs.map((q, idx) => {
const correctAns = q.ans;
// 他の119個から2つ重複なく誤答を選択
const otherAnsList = Array.from(new Set(allAnswers.filter(a => a !== correctAns)));
// 簡易シード乱数で毎回決まった選択肢を安定生成（リロードしても変わらないように）
const rand1 = (q.id * 7 + partNum * 13) % otherAnsList.length;
let rand2 = (q.id * 11 + partNum * 17) % otherAnsList.length;
if (rand1 === rand2) rand2 = (rand2 + 1) % otherAnsList.length;

const distractor1 = otherAnsList[rand1];
const distractor2 = otherAnsList[rand2];

let choices = [
{ t: correctAns, correct: true },
{ t: distractor1, correct: false },
{ t: distractor2, correct: false }
];

// 選択肢の並び順を問題IDをもとに決定（A/B/Cランダム）
const shufflePattern = (q.id + partNum) % 3;
if (shufflePattern === 1) choices = [choices[1], choices[0], choices[2]];
else if (shufflePattern === 2) choices = [choices[2], choices[1], choices[0]];

const opts = choices.map((c, cIdx) => ({
t: `${String.fromCharCode(65 + cIdx)}: ${c.t}`,
correct: c.correct
}));

return {
id: q.id,
question: `「${q.jp}」<br><strong>${q.eng}</strong>`,
explanation: `【判断基準】「${q.jp}」にあたる表現は「${correctAns}」です。`,
opts: opts
};
});

return {
title: `⑧ 頻出熟語 Part ${partNum}（Q${startIdx + 1}〜${endIdx}）`,
desc: `入試頻出表現120（第${partNum}ステージ）。例文の空所に入る適切な表現を判定します。`,
items: items
};
}

function saveProgress() {
if (!state.currentCategory) return;
try {
let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
savedData[state.currentCategory] = { currentIndex: state.currentIndex, currentStepIndex: state.currentStepIndex, subQIndex: state.subQIndex };
localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
} catch (e) {}
}
function loadProgress(catKey) {
try {
let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
return savedData[catKey] || null;
} catch (e) { return null; }
}
function clearCategoryProgress(catKey) {
try {
let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
delete savedData[catKey];
localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
} catch (e) {}
}
function resetAllProgress() {
if (confirm("全てのステージの学習途中の経過を初期化しますか？\n（最初からやり直すことになります）")) {
localStorage.removeItem(STORAGE_KEY);
playSound('click');
renderHome();
}
}
function getCategoryProgressInfo(catKey) {
const catData = db[catKey];
if (!catData || !catData.items || catData.items.length === 0) return { pct: 0, isStarted: false, isCleared: false };
const totalItems = catData.items.length;
const progress = loadProgress(catKey);
if (!progress) return { pct: 0, isStarted: false, isCleared: false };
let currentItem = progress.currentIndex;
if (currentItem >= totalItems) return { pct: 100, isStarted: true, isCleared: true };
if (catKey === 'quickGrammar' || catKey.startsWith('idiomsStage')) {
let pct = Math.min(99, Math.round((currentItem / totalItems) * 100));
return { pct, isStarted: currentItem > 0, isCleared: false, currentItem: currentItem + 1 };
}
let totalStepsOverall = 0;
catData.items.forEach(it => { totalStepsOverall += (catKey === 'reading') ? ((it.subQs ? it.subQs.length : 0) + (it.steps ? it.steps.length : 0) + 1) : ((it.steps ? it.steps.length : 0) + 1); });
let doneStepsOverall = 0;
for (let i = 0; i < currentItem; i++) {
let it = catData.items[i];
doneStepsOverall += (catKey === 'reading') ? ((it.subQs ? it.subQs.length : 0) + (it.steps ? it.steps.length : 0) + 1) : ((it.steps ? it.steps.length : 0) + 1);
}
doneStepsOverall += (catKey === 'reading') ? progress.subQIndex : progress.currentStepIndex;
let pct = Math.min(99, Math.round((doneStepsOverall / Math.max(1, totalStepsOverall)) * 100));
return { pct, isStarted: doneStepsOverall > 0, isCleared: false, currentItem: currentItem + 1 };
}

function startCategory(catKey, forceReset = false) {
state.currentCategory = catKey;
if (forceReset) {
state.currentIndex = 0; state.currentStepIndex = 0; state.subQIndex = 0;
clearCategoryProgress(catKey);
} else {
const saved = loadProgress(catKey);
if (saved) {
state.currentIndex = saved.currentIndex || 0;
state.currentStepIndex = saved.currentStepIndex || 0;
state.subQIndex = saved.subQIndex || 0;
} else {
state.currentIndex = 0; state.currentStepIndex = 0; state.subQIndex = 0;
}
}
homeBtn.classList.remove('hidden');
renderQuestion();
}

function renderQuestion() {
window.scrollTo(0, 0);
saveProgress();
container.classList.remove('fade-in');
void container.offsetWidth;
container.classList.add('fade-in');
const catData = db[state.currentCategory];
if (state.currentCategory === 'listening') { renderListeningQuestion(catData); return; }
const item = catData.items[state.currentIndex];
const totalItems = catData.items.length;

if (state.currentCategory === 'quickGrammar' || state.currentCategory.startsWith('idiomsStage')) {
renderQuickGrammarQuestion(catData, item, totalItems);
return;
}
if (state.currentCategory === 'reading') {
renderReadingQuestion(catData, item, totalItems);
return;
}

const steps = item.steps || [];
const isRepro = state.currentStepIndex >= steps.length;
const progressPct = Math.round(((state.currentIndex * (steps.length + 1) + state.currentStepIndex) / (totalItems * (steps.length + 1))) * 100);
let headerHTML = `
<div class="flex justify-between items-center mb-4">
<span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-md">
${catData.title} （問題 ${state.currentIndex + 1} / ${totalItems}）
</span>
<span class="text-xs font-bold text-slate-500">${progressPct}% 完了</span>
</div>
<div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-6">
<div class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
</div>
`;
if (!isRepro) {
const step = steps[state.currentStepIndex];
container.innerHTML = `
${headerHTML}
<div class="space-y-6">
<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm font-sans">
${item.passage}
</div>
<div>
<span class="text-xs font-extrabold text-indigo-600 uppercase tracking-wider block mb-1">
STEP ${state.currentStepIndex + 1} / ${steps.length}: ${step.title}
</span>
<h3 class="font-bold text-slate-900 text-base sm:text-lg">${step.q}</h3>
</div>
<div class="space-y-3" id="options-box">
${step.opts.map((opt, idx) => `
<button onclick="app.checkAns(${idx}, ${opt.correct}, '${encodeURIComponent(opt.fb)}', false)" class="opt-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all font-medium text-slate-700 flex items-start gap-3">
<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
<span class="text-sm sm:text-base">${opt.t}</span>
</button>
`).join('')}
</div>
<div id="feedback-box" class="hidden"></div>
<button id="next-step-btn" onclick="app.nextStep()" class="hidden w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition-all flex items-center justify-center gap-2">
<span>次のステップへ進む</span> <i class="fa-solid fa-arrow-right"></i>
</button>
</div>
`;
} else {
const repro = item.repro;
container.innerHTML = `
${headerHTML}
<div class="space-y-6">
<div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs font-bold text-amber-800 flex items-center gap-2">
<i class="fa-solid fa-fire text-amber-600 text-base"></i> 最終確認：類題での再現テスト
</div>
<div class="bg-slate-900 text-white p-5 rounded-xl space-y-3 shadow-inner font-sans">
<p class="text-base text-slate-100 leading-relaxed">${repro.passage}</p>
<p class="font-bold text-teal-300 text-base border-t border-slate-700 pt-3">${repro.q}</p>
</div>
<div class="space-y-3" id="options-box">
${repro.opts.map((opt, idx) => `
<button onclick="app.checkAns(${idx}, ${opt.correct}, '${encodeURIComponent(opt.fb)}', true)" class="repro-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all font-medium text-slate-700 flex items-start gap-3">
<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + idx)}</span>
<span class="text-sm sm:text-base">${opt.t}</span>
</button>

</div>

}

function checkQuickGrammarAns(idx, isCorrect) {
const fbBox = document.getElementById('feedback-box');
const buttons = document.querySelectorAll('.quick-opt-btn');
const clickedBtn = buttons[idx];
const catData = db[state.currentCategory];
const item = catData.items[state.currentIndex];
const explanation = item.explanation || '';
if (isCorrect) {
playSound('correct');
confetti({ particleCount: 50, spread: 50, origin: { y: 0.6 } });
buttons.forEach(b => { b.disabled = true; b.classList.add('opacity-60', 'cursor-not-allowed'); });
clickedBtn.classList.remove('border-slate-200', 'opacity-60');
clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-500/20');
fbBox.className = 'p-5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm space-y-2 fade-in';
fbBox.innerHTML = `
<div class="font-bold text-base flex items-center gap-2 text-emerald-700">
<i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i> 正解！
</div>
<p class="text-slate-700 font-medium leading-relaxed bg-white/70 p-3 rounded-lg border border-emerald-100">
<span class="font-bold text-emerald-800">【解説】</span><br>${explanation}
</p>
`;
fbBox.classList.remove('hidden');
document.getElementById('next-item-btn').classList.remove('hidden');
} else {
playSound('wrong');
clickedBtn.disabled = true;
clickedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900', 'opacity-70');
fbBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';
fbBox.innerHTML = `
<div class="font-bold text-base flex items-center gap-2">
<i class="fa-solid fa-circle-xmark text-rose-500"></i> 不正解です。
</div>
<p class="text-xs text-rose-700">もう一度よく考えて別の選択肢を選んでみましょう！</p>
`;
fbBox.classList.remove('hidden');
}
}

function renderReadingQuestion(catData, item, totalItems) {
saveProgress();
const subQ = item.subQs[state.subQIndex];
const totalSubQs = item.subQs.length;

let listeningRate = 0.9;
function chooseEnglishVoice(voices, gender) {
 const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
 if (!english.length) return null;
 // OS/browser voice names differ, so use name clues when available and fall back gracefully.
 const femaleHints = /female|woman|samantha|victoria|karen|susan|zira|aria|jenny|ava|allison|moira|tessa|serena|fiona/i;
 const maleHints = /male|man|daniel|david|alex|fred|tom|guy|ryan|james|lee|oliver|aaron/i;
 const hints = gender === 'female' ? femaleHints : maleHints;
 return english.find(v => hints.test(v.name)) || english.find(v => hints.test(v.voiceURI || '')) || english[0];
}
function playListeningAudio(itemOrText) {
 if (!('speechSynthesis' in window)) {
   alert('このブラウザは音声読み上げに対応していません。SafariまたはChromeでお試しください。');
   return;
 }
 window.speechSynthesis.cancel();
 const voices = window.speechSynthesis.getVoices();
 const isItem = typeof itemOrText === 'object' && itemOrText !== null;
 const audioText = isItem ? itemOrText.audio : String(itemOrText);
 // 対話文は話者ラベルごとに音声を切り替え、独白は従来どおり1人の声で再生する。
 const lines = isItem && itemOrText.type === 'dialogue'
   ? audioText.split('\n').map(line => {
       const match = line.match(/^\s*(Girl|Woman|Female|Boy|Man|Male)\s*:\s*(.*)$/i);
       if (!match) return { text: line, gender: 'female' };
       const speaker = match[1].toLowerCase();
       return { text: match[2], gender: /^(girl|woman|female)$/.test(speaker) ? 'female' : 'male' };
     }).filter(line => line.text.trim())
   : [{ text: audioText, gender: 'neutral' }];
 let index = 0;
 const speakNext = () => {
   if (index >= lines.length) return;
   const line = lines[index++];
   const utterance = new SpeechSynthesisUtterance(line.text);
   utterance.lang = 'en-US';
   utterance.rate = listeningRate;
   utterance.pitch = line.gender === 'female' ? 1.20 : 0.80;
   let voice = line.gender === 'neutral'
     ? chooseEnglishVoice(voices, 'female')
     : chooseEnglishVoice(voices, line.gender);
   if (voice) utterance.voice = voice;
   utterance.onend = () => {
    if (isItem && itemOrText.type === 'dialogue') {
        setTimeout(speakNext, 600);
    } else {
        speakNext();
    }
};
   utterance.onerror = (event) => {
     if (event.error !== 'canceled' && event.error !== 'interrupted') speakNext();
   };
   window.speechSynthesis.speak(utterance);
 };
 // iOSなど、音声一覧の準備が遅れる環境にも対応するため、取得後に再生開始。
 if (voices.length) speakNext();
 else {
   window.speechSynthesis.onvoiceschanged = () => {
     window.speechSynthesis.onvoiceschanged = null;
     speakNext();
   };
   setTimeout(() => { if (index === 0) speakNext(); }, 500);
 }
}

 `;
}
